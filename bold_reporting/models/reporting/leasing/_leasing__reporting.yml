version: 2

models:
  - name: rpt_summarized_rent_roll
    description: >
      Base consumible para Bold Reports. La vista preserva rangos de vigencia
      para que Bold aplique filtros runtime con @AsOfDate, @Property_Name,
      @REAL_COMPANY_ID, @floorPlan y @month_to_month sin recompilar dbt.

  - name: rpt_rent_roll_increases
    description: >
      Base consumible para Bold Reports del reporte Rent Roll Increases. Expone
      el detalle vigente del rent roll junto con fechas de vigencia de cargos
      para detectar escalaciones futuras en runtime con @AsOfDate.

  - name: rpt_occupied_square_footage
    description: >
      Base consumible para Bold Reports del reporte Occupied Square Footage.
      Preserva rangos de vigencia para filtrar con @AsOfDate y expone sqft
      ocupado/vacante con asignacion segura para unidades con multiples leases.

  - name: rpt_lease_abstract
    description: >
      Base consumible para Bold Reports del reporte Lease Abstract. Reemplaza el
      dataset embebido Lease_Abstract y expone rcharge_status_valid_from/to para
      resolver RCHARGE_STATUS con @AsOfDate en runtime.

  - name: rpt_lease_abstract_tenant
    description: >
      Base consumible para el lookup Lease_Tenant del reporte Lease Abstract.

  - name: rpt_lease_abstract_late_charges
    description: >
      Base consumible para el lookup Lease_Late_Charges del reporte Lease
      Abstract. Expone fechas valid_to para aplicar @AsOfDate en runtime.

  - name: rpt_lease_abstract_deposits
    description: >
      Base consumible para el lookup Lease_Deposit del reporte Lease Abstract.

  - name: rpt_lease_abstract_clauses
    description: >
      Base consumible para el lookup Lease_Clauses del reporte Lease Abstract.
      Expone lease_option_valid_to para aplicar @AsOfDate en runtime.
