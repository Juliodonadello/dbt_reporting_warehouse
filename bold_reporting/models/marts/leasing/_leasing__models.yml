version: 2

models:
  - name: dim_property
    columns:
      - name: property_id
        tests:
          - not_null
          - unique

  - name: dim_unit
    columns:
      - name: property_id
        tests:
          - not_null
      - name: unit_id
        tests:
          - not_null

  - name: dim_lease
    columns:
      - name: property_id
        tests:
          - not_null
      - name: unit_id
        tests:
          - not_null
      - name: lease_id
        tests:
          - not_null

  - name: fct_lease_charge
    columns:
      - name: recurring_charge_id
        tests:
          - not_null
      - name: charge_valid_from
        tests:
          - not_null
      - name: charge_valid_to
        tests:
          - not_null

  - name: fct_summarized_rent_roll_detail
    description: >
      Vista con el detalle temporal completo de unidades, leases y cargos.
      Conserva rangos [report_valid_from, report_valid_to) para que la query
      final aplique sus parámetros antes de calcular agregaciones.
    columns:
      - name: prop_id
        tests:
          - not_null
      - name: unit_id
        tests:
          - not_null
      - name: report_valid_from
        tests:
          - not_null
      - name: report_valid_to
        tests:
          - not_null

  - name: fct_rent_roll_increases_detail
    description: >
      Detalle report-ready para Rent Roll Increases. Enriquece el rent roll
      temporal con nombre de lease, estado de unidad y vigencia propia del
      cargo para que Bold pueda filtrar aumentos futuros con @AsOfDate.
    columns:
      - name: prop_id
        tests:
          - not_null
      - name: unit_id
        tests:
          - not_null
      - name: report_valid_from
        tests:
          - not_null
      - name: report_valid_to
        tests:
          - not_null
